version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      dev-tooling:
        patterns:
          - '@eslint/*'
          - 'eslint*'
          - 'typescript-eslint'
          - 'vitest'
          - '@vitest/*'
          - '@playwright/test'
        update-types:
          - minor
          - patch
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
    ignore:
      # Cadenas fijadas por compatibilidad: ver la sección de stack en CONTRIBUTING.md.
      - dependency-name: electron
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
