name: Reporte de error
description: Algo no funciona como debería en Hybi.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Si el fallo tiene que ver con la seguridad de la
        aplicación, **no abras un issue**: sigue el proceso de [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Describe el fallo en una o dos frases.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de Hybi
      placeholder: '0.2.0'
    validations:
      required: true

  - type: dropdown
    id: sistema
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Contexto adicional
      description: Capturas, mensajes de error o cualquier detalle que ayude.

  - type: checkboxes
    id: confirmaciones
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué issues abiertos y no encontré este fallo reportado.
          required: true
        - label: No incluí tokens, contraseñas ni datos privados en el reporte.
          required: true
